# Docstyle subproject for the protocol documents (Word output).
# The website build at the repo root still includes these QMDs (a nested
# _quarto.yml does not exclude them); this file applies only when a protocol
# QMD is rendered directly:
#   quarto render docs/protocol/full-protocol.qmd     # -> docs/protocol/output/*.docx
# Round-trip after Word edits:
#   docstyle::docx_to_qmd("docs/protocol/source/<edited>.docx", "docs/protocol/full-protocol.qmd")
# The docstyle tooling resolves _extensions/ and _docstyle/ relative to this
# directory, hence the _extensions symlink and the local _docstyle/ sidecar.
project:
  type: default
  output-dir: output
  pre-render: _extensions/docstyle/generate-reference.R
  post-render: _extensions/docstyle/update-field-codes.R

bibliography: ../../references.bib

format:
  docstyle-docx:
    toc: false
    number-sections: false
    reference-doc: _docstyle/reference.docx

docstyle:
  css:
    - ../../popcorn-base.css
    - ../../pop-draft-manuscript.css
    - protocol.css
  sidecar-dir: _docstyle
  header:
    enabled: true
    left: "CSHM Study Protocol"
    first-page: false
    style: header
  footer:
    enabled: true
    left: "DRAFT"
    right: "Page {page} of {pages}"
    first-page: false
    style: footer
  toc:
    title: "Table of contents"
    levels: "1-3"
  author-plate:
    enabled: false
  version-history:
    enabled: true
    title: "Version history"
    style: "table-formal"

