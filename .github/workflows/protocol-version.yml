name: Protocol version check

# The study protocol is a prespecified governance document: any change to
# docs/protocol/ must be recorded in a version bump, not edited silently.
#
# Two documents are versioned on independent tracks:
#   - full-protocol.qmd       — version-summary.version frontmatter; also the
#                               version of record for appendices and any other
#                               docs/protocol/ file without its own stamp.
#   - study-summary.qmd       — a plain-text "Version X.Y.Z" stamp on its own
#                               track (it summarizes a given full-protocol
#                               version but advances independently).
#
# This check fails a PR that changes either document without bumping that
# document's own version.

on:
  pull_request:
    paths:
      - "docs/protocol/**"

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump for each changed protocol document
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          git fetch origin "${BASE_REF}" --depth=1

          changed=$(git diff --name-only "$base"...HEAD -- docs/protocol/)
          echo "Protocol files changed:"
          echo "${changed:-<none>}"
          [ -z "$changed" ] && { echo "No protocol files changed."; exit 0; }

          # Version getters return an empty string (never a non-zero exit) when
          # the file is absent from a ref — e.g. a newly added, deleted, or
          # renamed protocol file. The trailing `|| true` keeps `set -e` from
          # aborting the step on the git-show/pipe failure so the explicit
          # empty-string handling below can emit a clear error instead.
          # full-protocol.qmd: version-summary.version frontmatter
          full_version() {
            git show "$1:docs/protocol/full-protocol.qmd" 2>/dev/null \
              | awk '/^version-summary:/{f=1; next} f && /version:/{gsub(/[" ]/, "", $2); print $2; exit}' || true
          }
          # study-summary.qmd: first plain-text "Version X.Y.Z" stamp
          summary_version() {
            git show "$1:docs/protocol/study-summary.qmd" 2>/dev/null \
              | grep -m1 -oE 'Version [0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}' || true
          }

          fail=0

          # study-summary.qmd is on its own track
          if echo "$changed" | grep -qx "docs/protocol/study-summary.qmd"; then
            b=$(summary_version "$base"); h=$(summary_version HEAD)
            echo "study-summary.qmd: ${b:-<none>} -> ${h:-<none>}"
            if [ -z "$h" ]; then
              echo "::error file=docs/protocol/study-summary.qmd::Could not parse a 'Version X.Y.Z' stamp."
              fail=1
            elif [ "$b" = "$h" ]; then
              echo "::error file=docs/protocol/study-summary.qmd::study-summary.qmd changed but its Version stamp is still ${h}. Bump it and add a change-log entry."
              fail=1
            fi
          fi

          # Any other protocol file (full protocol, appendices, ...) is versioned
          # via full-protocol.qmd.
          if echo "$changed" | grep -vx "docs/protocol/study-summary.qmd" | grep -q .; then
            b=$(full_version "$base"); h=$(full_version HEAD)
            echo "full-protocol.qmd: ${b:-<none>} -> ${h:-<none>}"
            if [ -z "$h" ]; then
              echo "::error file=docs/protocol/full-protocol.qmd::Could not parse version-summary.version."
              fail=1
            elif [ "$b" = "$h" ]; then
              echo "::error file=docs/protocol/full-protocol.qmd::A protocol file changed but version-summary.version is still ${h}. Bump it and add a version-history entry."
              fail=1
            fi
          fi

          exit $fail
